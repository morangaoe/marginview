# Self-hosted alternative to Render (any VPS):  cd deploy && docker compose up -d --build
# Needs deploy/.env with API_HOST (e.g. 203-0-113-7.sslip.io) plus the API variables from apps/api/.env.example.
# No Redis: jobs are queued in Postgres. Scrapy runs inside the API image (SCRAPY_LOCAL=true).
services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PORT: 4000
    restart: unless-stopped
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  caddy-data:
