# Runs on the Oracle Always-Free VM:  cd deploy && docker compose up -d --build
# Needs deploy/.env with API_HOST (e.g. 203-0-113-7.sslip.io) plus the API variables from apps/api/.env.example.
services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      SCRAPY_URL: http://scrapy:8000
    depends_on: [redis, scrapy]
    restart: unless-stopped
    stop_grace_period: 20s

  scrapy:
    build: ../apps/scrapy
    environment:
      SCRAPY_TOKEN: ${SCRAPY_TOKEN:-}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
